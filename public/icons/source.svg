<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Arte original do app: moeda em forma de "C" aberto com um "F" ao centro.
       Fundo = token fc-void (#04060b); a moeda cabe em ~66% da tela (zona segura do ícone maskable). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#6f7dff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6f7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d0ff"/>
      <stop offset="1" stop-color="#6f7dff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#04060b"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <path d="M741.8 319.1 A300 300 0 1 0 741.8 704.9" fill="none" stroke="url(#iris)" stroke-width="40" stroke-linecap="round"/>
  <g fill="url(#iris)">
    <rect x="430" y="380" width="58" height="264" rx="29"/>
    <rect x="430" y="380" width="170" height="58" rx="29"/>
    <rect x="430" y="490" width="128" height="54" rx="27"/>
  </g>
</svg>
