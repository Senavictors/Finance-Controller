name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # Inclui os guards (tests/guards) e a suite de dominio.
      - run: npm test

      # Build sem aplicar migrations: a URL e apenas um placeholder para o build nao quebrar
      # na leitura da variavel. O CI nunca altera schema nem usa banco real (RN-04).
      - run: npx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Barreira final contra dados reais (Constituicao).
      - run: npm run guard:data
